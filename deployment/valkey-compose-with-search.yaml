services:
  redis:
    image: docker.io/valkey/valkey-search:8.0.1-ubuntu
    container_name: redis-valkey
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: "valkey-server --save 30 1 --protected-mode no"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - redis-valkey

volumes:
  redis-data:

networks:
  redis-valkey:
    external: false
