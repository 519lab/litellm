name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ggrace519/.github/.github/workflows/release.yml@8217a8363cd8f8222471a39df2a0892e0fec2c00 # v2.0.0
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}
