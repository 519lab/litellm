name: Create Daily Staging Branch

on:
  schedule:
    - cron: "0 0,12 * * *" # Runs every 12 hours at midnight and noon UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  create-staging-branch:
    if: github.repository == 'BerriAI/litellm'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create daily staging branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate branch name with MM_DD_YYYY format
          BRANCH_NAME="litellm_oss_staging_$(date +'%m_%d_%Y')"
          echo "Creating branch: $BRANCH_NAME"

          # Fetch all branches
          git fetch --all

          # Check if the branch already exists
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
            echo "Branch $BRANCH_NAME already exists. Skipping creation."
          else
            echo "Creating new branch: $BRANCH_NAME"
            # Create the new branch from main
            git checkout -b $BRANCH_NAME origin/main
            # Push the new branch
            git push origin $BRANCH_NAME
            echo "Successfully created and pushed branch: $BRANCH_NAME"
          fi

  create-internal-dev-branch:
    if: github.repository == 'BerriAI/litellm'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create internal dev branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate branch name with MM_DD_YYYY format
          BRANCH_NAME="litellm_internal_dev_$(date +'%m_%d_%Y')"
          echo "Creating branch: $BRANCH_NAME"

          # Fetch all branches
          git fetch --all

          # Check if the branch already exists
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
            echo "Branch $BRANCH_NAME already exists. Skipping creation."
          else
            echo "Creating new branch: $BRANCH_NAME"
            # Create the new branch from main
            git checkout -b $BRANCH_NAME origin/main
            # Push the new branch
            git push origin $BRANCH_NAME
            echo "Successfully created and pushed branch: $BRANCH_NAME"
          fi
