name: Guard main branch

on:
  pull_request:
    branches:
      - main
  merge_group:

permissions: {}

# DO NOT RENAME the job's `name:` — it is referenced by GitHub branch
# protection as a required status check on `main`. Renaming silently
# breaks the gate.
jobs:
  guard:
    name: Verify PR source branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject merge_group events
        if: github.event_name == 'merge_group'
        run: |
          echo "::error::Merge queue is not supported for main. Disable merge queue or update this guard."
          exit 1
      - name: Check head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "PR head repo: $HEAD_REPO"
          echo "PR head branch: $HEAD_REF"
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PRs to main must originate from the canonical repository ($BASE_REPO), not a fork ($HEAD_REPO). Open the PR against develop instead."
            exit 1
          fi
          if [ "$HEAD_REF" = "develop" ]; then
            echo "Allowed source branch."
            exit 0
          fi
          echo "::error::PRs to main must originate from 'develop' (promotion). Got: '$HEAD_REF'. Open the PR against develop instead; hotfixes go through develop too."
          exit 1
