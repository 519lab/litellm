name: Conventional PR Title

# PRs on this fork land with a merge commit, so every individual commit reaches
# develop as written and this title check does not gate them. The local
# commit-msg hook (.githooks/commit-msg, installed by make bootstrap) is what
# checks each commit; this workflow checks the PR title.
#
# See https://www.conventionalcommits.org/en/v1.0.0/

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Validate PR title
    # The develop -> main promotion PR is opened by the promote workflow with a fixed title.
    if: ${{ !(github.head_ref == 'develop' && github.base_ref == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check title against Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must mirror the type list in .githooks/commit-msg.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase character.
          # Allow merges/reverts that GitHub generates automatically.
          ignoreLabels: |
            ignore-semantic-pull-request
